<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quote | Quote System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Edit Quote: retrieve a quote by ID, edit its line items/discount/notes, and sanction it. -->
    <header class="site-header">
        <div class="header-content">
            <h1>Quote System</h1>
        </div>
    </header>

    <main class="page-shell">
        <section class="card" aria-labelledby="edit-quote-title">
            <h1 id="edit-quote-title">Edit Quote</h1>

            <div id="message" class="message" role="alert" aria-live="polite"></div>

            <form id="load-quote-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="lookup_quote_id">Quote ID</label>
                        <input
                            type="number"
                            id="lookup_quote_id"
                            name="lookup_quote_id"
                            min="1"
                            required
                        >
                    </div>
                </div>

                <div class="actions">
                    <button id="load-button" class="button button-primary" type="submit">
                        Load Quote
                    </button>
                </div>
            </form>

            <div id="quote-details" class="quote-details" hidden>
                <div class="section-heading">
                    <h2>Quote Details</h2>
                </div>

                <dl class="detail-grid">
                    <div><dt>Quote ID</dt><dd id="detail-quote-id"></dd></div>
                    <div><dt>Customer ID</dt><dd id="detail-customer-id"></dd></div>
                    <div><dt>Associate</dt><dd id="detail-associate-id"></dd></div>
                    <div><dt>Customer Email</dt><dd id="detail-customer-email"></dd></div>
                    <div><dt>Created</dt><dd id="detail-created-date"></dd></div>
                    <div><dt>Status</dt><dd id="detail-status"></dd></div>
                    <div><dt>Final Amount</dt><dd id="detail-final-amount"></dd></div>
                    <div><dt>PO Number</dt><dd id="detail-po-number"></dd></div>
                </dl>

                <form id="edit-quote-form">
                    <div class="section-heading">
                        <h2>Line Items</h2>
                        <button id="add-item-button" class="button button-secondary" type="button">
                            Add Line Item
                        </button>
                    </div>

                    <div id="line-items" class="line-items"></div>

                    <div class="section-heading">
                        <h2>Edit Quote</h2>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="discount_type">Discount Type</label>
                            <select id="discount_type" name="discount_type">
                                <option value="">No discount</option>
                                <option value="percent">Percent</option>
                                <option value="amount">Amount</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="discount_value">Discount Value</label>
                            <div class="input-with-suffix">
                                <input type="number" id="discount_value" name="discount_value" min="0" step="0.01" value="0">
                                <span id="discount-unit" class="discount-unit"></span>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label>Secret Notes</label>
                            <div id="existing-secret-notes" class="readonly-notes"></div>
                        </div>

                        <div class="form-group full-width">
                            <label for="new_secret_note">Add Additional Notes</label>
                            <textarea
                                id="new_secret_note"
                                name="new_secret_note"
                                rows="3"
                                maxlength="2000"
                                placeholder="Add a new note for internal staff only"
                            ></textarea>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="save-draft-button" class="button button-secondary" type="submit">
                            Save Draft
                        </button>
                        <button id="save-button" class="button button-primary" type="submit">
                            Sanction Quote
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <template id="line-item-template">
        <div class="line-item">
            <div class="form-group item-id-group">
                <label>Item</label>
                <select class="item-id" required></select>
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input class="item-quantity" type="number" min="1" value="1" required>
            </div>

            <button class="button button-danger remove-item-button" type="button">
                Remove
            </button>

            <ul class="index-list item-index"></ul>
        </div>
    </template>

    <script src="common.js"></script>
    <script src="quoteDetails.js"></script>
    <script src="editQuote.js"></script>
</body>
</html>
