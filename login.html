<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Associate Login | Quote System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="login-shell">
        <section class="card login-card" aria-labelledby="login-title">
            <h1 id="login-title">Quote System</h1>
            <p class="subtitle">Sales Associate Login</p>

            <div id="message" class="message" role="alert" aria-live="polite"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="user_id">User ID</label>
                    <input
                        type="text"
                        id="user_id"
                        name="user_id"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group" style="margin-top: 16px;">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button id="login-button" class="button button-primary full-button" type="submit">
                    Log In
                </button>
            </form>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
